[project]
name = "wrds-mcp"
version = "0.1.0"
description = "MCP server that lets Claude search the WRDS catalog, check data availability and run policy-guarded queries"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.2,<3",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "pyarrow>=15",
]

[project.scripts]
wrds-mcp = "wrds_mcp.server:main"
wrds-mcp-setup = "wrds_mcp.setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wrds_mcp"]
